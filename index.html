<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BONGO FLAVA FOREVER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #000, #222);
      padding: 30px 15px;
      text-align: center;
      border-bottom: 2px solid #d4af37;
    }

    header h1 {
      color: #d4af37;
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      color: #ddd;
      font-size: 15px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px;
      background: #111;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 20px;
      background: #222;
    }

    nav a:hover {
      background: #d4af37;
      color: black;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero h2 {
      color: #d4af37;
      font-size: 27px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #ccc;
    }

    .songs {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .song {
      background: #151515;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .song h3 {
      color: #d4af37;
      margin-bottom: 15px;
      word-break: break-word;
    }

    audio {
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      margin-top: 30px;
      background: #111;
      color: #aaa;
      border-top: 1px solid #333;
    }
  </style>
</head>

<body>

  <header>
    <h1>BONGO FLAVA FOREVER</h1>
    <p>Real Love • Real Pain • Real Music</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#nyimbo">Nyimbo</a>
  </nav>

  <section class="hero" id="home">
    <h2>KARIBU BONGO FLAVA FOREVER</h2>
    <p>Sikiliza nyimbo zako hapa moja kwa moja.</p>
  </section>

  <section class="songs" id="nyimbo">

    <div class="song">
      <h3>LeClassic X Kensa Boy_Binadamu</h3>

      <audio controls preload="metadata">
        <source src="LeClassic%20X%20Kensa%20Boy_Binadamu.mp3" type="audio/mpeg">
        Browser yako haiwezi kucheza audio.
      </audio>
    </div>

    <div class="song">
      <h3>Cool boyz</h3>

      <audio controls preload="metadata">
        <source src="Cool%20boyz.mp3" type="audio/mpeg">
        Browser yako haiwezi kucheza audio.
      </audio>
    </div>

  </section>

  <footer>
    <p>© 2026 BONGO FLAVA FOREVER</p>
    <p>Music • Love • Pain • Life</p>
  </footer>

</body>
</html>
